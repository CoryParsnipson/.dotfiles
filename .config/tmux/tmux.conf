# unbind default prefix key and use Ctrl+a as prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# enable mouse support (clickable windows, panes, resizeable panes)
set -g mouse on

# enable true color (RGB) support for xterm compatible terminals
# (required for modern themes/Neovim to look right)
set -g default-terminal "tmux-256color"

# smart pane switching with awareness of Neovim splits
# uses explicit variable stages instead of error-prone process matching
bind-key -n 'C-h' if-shell -F '#{@pane-is-vim}' 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell -F '#{@pane-is-vim}' 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell -F '#{@pane-is-vim}' 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell -F '#{@pane-is-vim}' 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# smart pane resizing with awareness of Neovim splits
bind-key -n M-h if-shell -F '#{@pane-is-vim}' 'send-keys M-h'  'resize-pane -L 2'
bind-key -n M-j if-shell -F '#{@pane-is-vim}' 'send-keys M-j'  'resize-pane -D 2'
bind-key -n M-k if-shell -F '#{@pane-is-vim}' 'send-keys M-k'  'resize-pane -U 2'
bind-key -n M-l if-shell -F '#{@pane-is-vim}' 'send-keys M-l'  'resize-pane -R 2'

# tpm and themes
set -g @plugin 'catppuccin/tmux'

# configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
